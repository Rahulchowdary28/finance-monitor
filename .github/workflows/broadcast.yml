name: Broadcast Web Push

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Notification Title'
        required: true
        default: 'Official Notice'
      message:
        description: 'Notification Message'
        required: true
        default: 'A new system update has been posted.'

jobs:
  send-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Execute Broadcast Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUBLIC_VAPID_KEY: ${{ secrets.PUBLIC_VAPID_KEY }}
          PRIVATE_VAPID_KEY: ${{ secrets.PRIVATE_VAPID_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          NOTIFICATION_TITLE: ${{ github.event.inputs.title }}
          NOTIFICATION_BODY: ${{ github.event.inputs.message }}
        run: npm run broadcast
